# source for instance data
input:
  raw_dir: /data/ML-Raw-Data/VIVLI
  it_file: VIVLI_FAMLI3_instance_metadata.csv
  project: VIVLI_FAMLI3

# information re output data
output:
  out_dir: /data/ML-Project-Data/VIVLI/Datasets/v1
  out_file: VIVLI_FAMLI3_prototype.csv
  folders:
    raw: frame5
    jpg: null
    pt: data

# image parameters
image:
  img_size: 288
  channels: 1
  dtype: uint8
  alpha: 0.075
  min_frames: 50
  max_mp4_frames: 10000
  sample_frames: 50
  doppler_rgb_thresh: 10
  doppler_ybr_thresh: 100
  doppler_pixel_thresh: 1000
  raw_frame_index: 5
  jpeg_quality: 100

# overall processing parameters
processing:
  cores: 48
  batch_size: 1000
  post_batch:
    enabled: false
    manifest_dir: /mnt/localssd/vivli_out/batch_manifests/VIVLI_FAMLI3
    command:
      - python3
      - /workspace/code/OBUS-GHL/ghlobus/ingestion/upload_batch_manifest_to_gcs.py
      - --manifest
      - "{manifest_path}"
      - --batch-log
      - "{batch_log_path}"
      - --out-dir
      - "{out_dir}"
      - --destination
      - gs://vivli-data/processed/FAMLI3
    delete_local_outputs: false
